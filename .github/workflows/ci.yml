name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  # ─── pre-commit ───────────────────────────────────────────────────────────
  # Runs every hook (gitleaks, ruff, hygiene) so `git commit --no-verify` is caught.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ─── test ─────────────────────────────────────────────────────────────────
  # Live (Azure) tests are deselected by default via pyproject addopts, so this
  # job never touches the network or spends money.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev --group cli
      - run: uv run ruff check .
      # The wheel ships py.typed, so the engine's annotations must hold.
      - run: uv run mypy
      # SAST (Python)
      - run: uv run bandit -r src -ll -q
      - run: uv run pytest

  # ─── audit ────────────────────────────────────────────────────────────────
  # Dependency CVE audit. Any --ignore-vuln must carry an inline reason and a
  # date to revisit.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --group dev --group cli
      - run: uv run pip-audit

  # ─── build ────────────────────────────────────────────────────────────────
  # Builds what we would publish and proves it installs and imports on its own.
  # No upload happens here; see release.yml.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: python scripts/check_dist.py dist
      # Install the wheel into a fresh venv and import it from outside the repo, so the
      # src/ layout can't mask a missing file.
      - run: |
          uv venv "$RUNNER_TEMP/smoke" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          cd "$RUNNER_TEMP"
          smoke/bin/python -c "import crowspeak_engine as e; print(e.__version__, e.__file__)"

  # ─── PLACEHOLDER: container scan ──────────────────────────────────────────
  # Enable when a Dockerfile exists. Scan BEFORE any push.
  # container:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - run: docker build -t crowspeak-core:ci .
  #     - uses: aquasecurity/trivy-action@<full-sha> # vX.Y.Z (pin when enabling)
  #       with:
  #         image-ref: crowspeak-core:ci
  #         exit-code: "1"
  #         severity: CRITICAL
  #         ignore-unfixed: true

  # ─── PLACEHOLDER: IaC scan ────────────────────────────────────────────────
  # Enable when Terraform/Bicep exists. Keep the checkov skip list documented
  # in a config file (see tailord's infra/providers/azure/.checkov.yaml).
  # infra:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
