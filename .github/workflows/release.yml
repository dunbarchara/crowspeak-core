name: Release

# Publishes crowspeak-engine to PyPI using OIDC trusted publishing: no API token is stored
# anywhere. Setup and procedure: docs/releasing.md.
#
#   git tag v0.1.0 && git push origin v0.1.0   # TestPyPI, then PyPI after approval
#   Run workflow manually                      # dry run: TestPyPI only
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: jobs only read the repo. The publish jobs add id-token: write.
permissions:
  contents: read

jobs:
  # ─── build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # A release tag must name the version the code reports (src/crowspeak_engine/_version.py).
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('src/crowspeak_engine/_version.py')['__version__'])")
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: python3 scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ─── TestPyPI ─────────────────────────────────────────────────────────────
  # Runs for tags and for manual dry runs. --check-url skips files already uploaded, so
  # re-running for the same version is safe.
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: >
          uv publish
          --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

  # ─── PyPI ─────────────────────────────────────────────────────────────────
  # Tags only. The `pypi` environment should require a reviewer (docs/releasing.md), so a
  # human confirms the TestPyPI result before anything reaches the real index.
  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always dist/*
