name: Release

# Publishes crowspeak-engine to PyPI using OIDC trusted publishing: no API token is stored
# anywhere. Setup and procedure: docs/releasing.md.
#
#   Merge a version bump to main   # TestPyPI, then PyPI after approval, then tag + GitHub Release
#   Run workflow manually          # dry run: TestPyPI only
on:
  push:
    branches: [main]
    paths: [src/crowspeak_engine/_version.py]
  workflow_dispatch:

# Least privilege: jobs only read the repo. The publish jobs add id-token: write.
permissions:
  contents: read

# One release at a time. A run waiting for PyPI approval holds the group, so a later merge
# queues behind it instead of racing it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─── check ────────────────────────────────────────────────────────────────
  # A push releases only a version that has no v<version> tag yet, so editing _version.py
  # without changing the number cannot try to republish. Manual runs always go ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('src/crowspeak_engine/_version.py')['__version__'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── build ────────────────────────────────────────────────────────────────
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - run: python3 scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ─── TestPyPI ─────────────────────────────────────────────────────────────
  # Runs for merges and for manual dry runs. --check-url skips files already uploaded, so
  # re-running for the same version is safe.
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: >
          uv publish
          --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

  # ─── PyPI ─────────────────────────────────────────────────────────────────
  # Merges only. The `pypi` environment should require a reviewer (docs/releasing.md), so a
  # human confirms the TestPyPI result before anything reaches the real index.
  publish-pypi:
    needs: publish-testpypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always dist/*

  # ─── tag ──────────────────────────────────────────────────────────────────
  # Records what shipped. Creating the release creates the tag on the released commit.
  tag:
    needs: [check, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --generate-notes
