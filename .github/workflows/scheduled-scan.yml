# PLACEHOLDER: periodic deep scans. The schedule trigger is commented out, so this
# only runs when started by hand (workflow_dispatch). Uncomment `schedule:` to enable.
name: Scheduled scan

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Full-history gitleaks scan (the pre-commit hook only scans staged changes).
      # Keep the image tag in step with the gitleaks rev in .pre-commit-config.yaml.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner
      - run: uv sync --frozen --group dev --group cli
      - run: uv run pip-audit
