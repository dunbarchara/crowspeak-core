[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crowspeak-engine"
dynamic = ["version"]
description = "UI-agnostic conversation engine for CrowSpeak language practice."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "dunbarchara" }]
keywords = ["language-learning", "conversation", "llm", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["openai>=1.50.0"]

[tool.setuptools.dynamic]
version = { attr = "crowspeak_engine._version.__version__" }

[tool.setuptools.package-data]
crowspeak_engine = ["py.typed"]

# Dev-only (PEP 735): not part of the published metadata. Install with `uv sync --group <name>`.
[dependency-groups]
cli = ["python-dotenv>=1.0.0"]
tui = ["textual>=0.80", "python-dotenv>=1.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16", "bandit[toml]>=1.8", "pip-audit>=2.9"]

# The published wheel is the engine only; crowspeak_cli and crowspeak_tui live in the repo.
[tool.setuptools.packages.find]
where = ["src"]
include = ["crowspeak_engine*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # line length handled by the formatter

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # tests also import crowspeak_cli, which is not in the wheel
asyncio_mode = "auto"
markers = ["live: hits the real Azure Foundry endpoint (costs money); opt-in via -m live"]
addopts = "-m 'not live'"
