[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowspeak-engine"
version = "0.1.0"
description = "UI-agnostic conversation engine for CrowSpeak language practice."
requires-python = ">=3.10"
dependencies = ["openai>=1.50.0"]

[project.optional-dependencies]
cli = ["python-dotenv>=1.0.0"]
tui = ["textual>=0.80", "python-dotenv>=1.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16", "bandit[toml]>=1.8", "pip-audit>=2.9"]

[project.scripts]
crowspeak-cli = "crowspeak_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # line length handled by the formatter

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Azure Foundry endpoint (costs money); opt-in via -m live"]
addopts = "-m 'not live'"
